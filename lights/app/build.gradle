plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tvhome.lights'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tvhome.lights'
        minSdk 26
        // 30, not 34: the devices run Android 9 and 11, and below 31 Bluetooth needs no runtime prompt.
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Sideloaded on two Android 9/11 devices, never on Google Play.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
